[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "zhixi-data-agent"
version = "0.1.0"
description = "Enterprise data analysis agent platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "celery[redis]>=5.4,<6",
  "cryptography>=50,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "minio>=7.2,<8",
  "pymysql>=1.1,<2",
  "weasyprint==70.0",
  "pyjwt>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.2,<7",
  "sqlalchemy>=2.0,<3",
  "sqlglot>=27.0,<29",
  "uvicorn[standard]>=0.34,<1",
  "langgraph>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "python-docx==1.2.0",
  "mypy>=1.14,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=7.1,<8",
  "types-pymysql>=1.1,<2",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["apps", "packages"]
