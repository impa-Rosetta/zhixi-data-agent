name: zhixi-data-agent

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhixi}
      POSTGRES_USER: ${POSTGRES_USER:-zhixi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhixi-local-only}
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhixi} -d ${POSTGRES_DB:-zhixi}"]
      interval: 5s
      timeout: 3s
      retries: 20

  source-postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: factory_demo
      POSTGRES_USER: source_admin
      POSTGRES_PASSWORD: source-admin-local-only
    ports: ["55432:5432"]
    volumes:
      - source-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/source-init.sql:/docker-entrypoint-initdb.d/001-source-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source_admin -d factory_demo"]
      interval: 5s
      timeout: 3s
      retries: 20

  source-mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: factory_demo
      MYSQL_ROOT_PASSWORD: source-admin-local-only
    ports: ["53306:3306"]
    volumes:
      - source-mysql-data:/var/lib/mysql
      - ./infra/mysql/source-init.sql:/docker-entrypoint-initdb.d/001-source-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-zhixi-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-zhixi-local-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["alembic", "upgrade", "head"]
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://zhixi:zhixi-local-only@postgres:5432/zhixi}
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://zhixi:zhixi-local-only@postgres:5432/zhixi}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      DATA_SOURCE_ALLOWED_PRIVATE_CIDRS: '${DATA_SOURCE_ALLOWED_PRIVATE_CIDRS:-["172.16.0.0/12"]}'
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://zhixi:zhixi-local-only@postgres:5432/zhixi}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      DATA_SOURCE_ALLOWED_PRIVATE_CIDRS: '${DATA_SOURCE_ALLOWED_PRIVATE_CIDRS:-["172.16.0.0/12"]}'
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A apps.worker.celery_app inspect ping -d worker@$${HOSTNAME}"]
      interval: 15s
      timeout: 8s
      retries: 8

  scheduler:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command:
      - "celery"
      - "-A"
      - "apps.worker.celery_app:celery_app"
      - "beat"
      - "--loglevel=INFO"
      - "--schedule=/tmp/celerybeat-schedule"
      - "--pidfile=/tmp/celerybeat.pid"
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://zhixi:zhixi-local-only@postgres:5432/zhixi}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      DATA_SOURCE_ALLOWED_PRIVATE_CIDRS: '${DATA_SOURCE_ALLOWED_PRIVATE_CIDRS:-["172.16.0.0/12"]}'
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports: ["5173:80"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  postgres-data:
  source-postgres-data:
  source-mysql-data:
  redis-data:
  minio-data:
